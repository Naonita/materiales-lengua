<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El espejo africano | Actividad Integradora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          serif: ['Spectral', 'ui-serif', 'Georgia', 'serif'],
        },
        keyframes: {
          fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
          scaleUp: { '0%': { opacity: 0, transform: 'scale(0.95)' }, '100%': { opacity: 1, transform: 'scale(1)' } },
        },
        animation: {
          fadeIn: 'fadeIn 0.4s ease-out',
          scaleUp: 'scaleUp 0.4s ease-out',
        }
      }
    }
  }
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-900">
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

// Banco de 9 preguntas adaptadas rigurosamente al voseo y a los contenidos de los Capítulos 1, 2 y 3.
const QUESTIONS = [
  // CAPÍTULO 1 & TEORÍA DE INTRODUCCIÓN
  {
    id: 1,
    category: "Pacto de Ficción y Verosimilitud",
    title: "Unidad 2 - Tema 1: El Pacto de Ficción",
    question: "Cuando leés la novela y aceptás de entrada que un pequeño espejo de ébano tiene la fuerza de enlazar destinos a través de los siglos, ¿qué concepto de la teoría literaria estás poniendo en juego?",
    options: [
      { key: "A", text: "El pacto de ficción, donde suspendés momentáneamente la incredulidad para aceptar las reglas internas de la obra." },
      { key: "B", text: "La lectura literal e histórica, que te exige comprobar científicamente la magia del objeto." },
      { key: "C", text: "La ruptura del verosímil para denunciar que las supersticiones africanas son falsas." },
      { key: "D", text: "Un método de estudio memorístico basado únicamente en fechas reales." }
    ],
    correctKey: "A",
    justification: "El 'pacto de ficción' es ese acuerdo implícito donde vos, como lector o lectora, aceptás la lógica interna que Liliana Bodoc construye, permitiendo que el viaje del espejo sea completamente creíble (verosímil) en su universo."
  },
  {
    id: 2,
    category: "Análisis del Relato y del Tiempo",
    title: "Unidad 2 - Tema 2: Historia frente a Relato",
    question: "Si analizás el orden de los capítulos, notás que el Capítulo 2 transcurre en 1818 y el Capítulo 3 retrocede a 1816. ¿Cómo se explica esta diferencia temporal según el marco teórico?",
    options: [
      { key: "A", text: "Es un error de impresión del libro que la autora no llegó a corregir." },
      { key: "B", text: "La 'Historia' es cronológica (1779 a 1818), pero el 'Relato' es el modo artístico y desordenado en que la autora elige contarte los hechos." },
      { key: "C", text: "Se trata de un recurso fantástico para demostrar que el espejo puede viajar físicamente al pasado." },
      { key: "D", text: "Es una técnica de estudio para que diseñes mapas conceptuales sin usar líneas de tiempo." }
    ],
    correctKey: "B",
    justification: "La 'Historia' es el conjunto de hechos ordenados de forma lineal en el tiempo real. El 'Relato' es la estructura estética que elige la autora (con saltos y alternancias temporales) para atraparte y generar un efecto artístico."
  },
  {
    id: 3,
    category: "Capítulo 1: Identidad y Desarraigo",
    title: "Unidad 2 - Tema 3: Atima Imaoma",
    question: "En el granero de la casa rioplatense, ¿de qué manera la pequeña esclava apodada 'Silencio' logra recuperar su verdadero nombre a los doce años?",
    options: [
      { key: "A", text: "Porque su amita Raquel se lo lee en voz alta de un acta de bautismo secreta." },
      { key: "B", text: "Al mirar en su espejo el pizarrón donde escribió 'AMO A MI AMITA', que al reflejarse al revés revela 'ATIMA IM A OMA'." },
      { key: "C", text: "Porque lo escucha en un canto secreto de las cocineras negras en el mercado de Buenos Aires." },
      { key: "D", text: "Porque el señor Fontezo y Cabrera se arrepiente y se lo confiesa antes de venderla." }
    ],
    correctKey: "B",
    justification: "El espejo muestra el mundo al revés. Al reflejar la frase escrita en el pizarrón del granero, las letras se reorganizan de forma mágica para devolverle a la niña su verdadera identidad arrebatada: Atima Imaoma."
  },

  {
    id: 4,
    category: "Teoría: Análisis de Personajes",
    title: "Unidad 2 - Tema 3: El Amo Ilustrado",
    question: "El material de lectura describe al señor Fontezo y Cabrera como un 'amo ilustrado'. ¿Qué contradicción histórica de la época colonial se critica a través de él?",
    options: [
      { key: "A", text: "La hipocresía de leer filosofía europea sobre la libertad y los derechos humanos mientras mantenía la propiedad y venta de personas." },
      { key: "B", text: "Que intentaba enseñar música clásica a sus esclavos pero les prohibía tocar instrumentos de viento." },
      { key: "C", text: "Su obsesión por documentar el mercado de esclavos de Buenos Aires usando mapas conceptuales." },
      { key: "D", text: "Que defendía la causa revolucionaria de San Martín pero se oponía a la donación de objetos." }
    ],
    correctKey: "A",
    justification: "El 'amo ilustrado' personifica la gran contradicción de la época: hombres refinados que debatían intelectualmente sobre la libertad, pero continuaban sosteniendo el sistema inhumano y económico de la esclavitud."
  },
  {
    id: 5,
    category: "Capítulo 2: El Encierro en España",
    title: "Unidad 2 - Tema 3: Dorel y los Miedos",
    question: "En la tienda de antigüedades de Valencia, ¿con qué temores y supersticiones mantenía María Petra a Dorel asustado y encerrado sin salir a la calle?",
    options: [
      { key: "A", text: "El peligro de naufragios en el puerto y el ataque de bestias salvajes de la selva africana." },
      { key: "B", text: "Que los soldados de San Martín confiscaran la tienda y que el clima frío le arruinara las manos para el violín." },
      { key: "C", text: "Moscas imaginarias de aguijón azul que envenenaban el corazón y moros que rondaban cortando cabezas para usarlas de cacerolas." },
      { key: "D", text: "La peste de la viruela negra y los castigos con látigo que recibían los jóvenes en el orfanato." }
    ],
    correctKey: "C",
    justification: "María Petra, su tutora y protectora, dominaba a Dorel infundiéndole miedos terribles e historias absurdas sobre el exterior para mantenerlo recluido y asegurar que se quedara trabajando en la tienda de antigüedades."
  },
  {
    id: 6,
    category: "Teoría: Actantes y Ayudantes",
    title: "Unidad 2 - Tema 3: Fuerzas de Apoyo",
    question: "Pensando en la teoría de los personajes actantes, ¿qué rol cumplen el maestro de Dorel y el niño pelirrojo en su historia?",
    options: [
      { key: "A", text: "Funcionan como oponentes que lo obligan a destruir el espejo de ébano para complacer a María Petra." },
      { key: "B", text: "Son ayudantes: el maestro le da la verdad histórica desmintiendo los miedos, y el niño despierta su compasión al necesitar monedas para medicinas." },
      { key: "C", text: "Son personajes secundarios sin ninguna influencia en las decisiones morales del protagonista." },
      { key: "D", text: "Actúan como jueces que lo acusan de haber robado tres monedas de la lata de la tienda." }
    ],
    correctKey: "B",
    justification: "Ambos actúan como 'ayudantes' morales. El maestro derriba el relato del miedo con el conocimiento real, y el niño pelirrojo lo saca de su propio egoísmo al obligarlo a mirar la necesidad ajena, lo que empuja a Dorel a cruzar el umbral."
  },

  {
    id: 7,
    category: "Simbolismo del Objeto",
    title: "Unidad 2 - Tema 3: El Espejo como Ayudante",
    question: "Cuando Dorel limpia el cristal del espejo con alcohol, ¿qué verdad existencial y física le devuelve el espejo que lo impulsa a tomar valor?",
    options: [
      { key: "A", text: "Le muestra la marca a punzón del general San Martín en el reverso de la madera." },
      { key: "B", text: "Le revela su propio rostro gris por el encierro y ojos casi viejos, haciéndole temer convertirse en alguien idéntico a María Petra." },
      { key: "C", text: "Le proyecta una visión mágica de Atima Imaoma cantando bajo la tormenta en Mendoza." },
      { key: "D", text: "Le enseña el mapa de Valencia para que aprenda a caminar sin perderse por las calles." }
    ],
    correctKey: "B",
    justification: "El espejo actúa como un personaje ayudante al confrontarlo con su triste realidad: un rostro envejecido por el encierro. Al verse, Dorel comprende que si no actúa para enmendar la injusticia con el niño, terminará siendo igual a su opresora."
  },
  {
    id: 8,
    category: "Capítulo 3: Mendoza, 1816",
    title: "Unidad 2 - Tema 2: El Espacio de la Huida",
    question: "Durante la huida de Atima Silencio en Mendoza bajo la tormenta de octubre de 1816, ¿qué accidente cambia drásticamente el rumbo de la persecución?",
    options: [
      { key: "A", text: "El capataz de la hacienda pierde el rastro de las sandalias de soga debido a la intensa lluvia." },
      { key: "B", text: "Una jauría de perros acorrala a Atima Silencio al borde de una pared rocosa vertical." },
      { key: "C", text: "El hijo mayor del amo, persiguiéndola con soberbia, pisa una roca suelta y cae gravemente herido al fondo del barranco." },
      { key: "D", text: "Un desmoronamiento de tierra bloquea las quebradas y los obliga a todos a refugiarse en los barracones." }
    ],
    correctKey: "C",
    justification: "La tormenta reblandeció el terreno de las quebradas rocosas. El hijo del amo, confiado en su fuerza y en sus botas de cuero, pisó una piedra suelta, perdió el apoyo y rodó de forma dramática hasta el fondo del barranco."
  },
  {
    id: 9,
    category: "Capítulo 3: El Valor y la Libertad",
    title: "Unidad 2 - Tema 3: Acciones que Liberan",
    question: "¿Cómo usa Atima Silencio su espejo de ébano para salvar al hijo del amo, y qué predicción amarga le hace este al otorgarle la libertad?",
    options: [
      { key: "A", text: "Usa el marco de ébano para entablillarle la pierna; el amo le advierte que morirá sola en los desiertos de Mendoza." },
      { key: "B", text: "Refleja la luz del sol para guiar con destellos a los rescatistas. El amo le da la libertad pero le vaticina que volverá pronto a mendigar con la mano extendida." },
      { key: "C", text: "Esconde el espejo en el barranco para que el brillo guíe a los caballos; el amo le jura que las tropas patriotas confiscarán su herencia." },
      { key: "D", text: "Usa el cristal para despertarlo reflejando sus ojos; el amo le advierte que Raquel la buscará para castigarla." }
    ],
    correctKey: "B",
    justification: "En un gesto de inmensa nobleza, Atima Silencio usa el espejo para guiar a los hombres del amo. Aunque el hacendado le otorga la libertad a regañadientes por pedido de su familia, le vaticina con crueldad colonial que la libertad para los exesclavos es hostil y que el hambre la obligará a regresar."
  }
];

function App() {
  const [activeTab, setActiveTab] = useState('quiz'); // 'quiz', 'oraculo' o 'teoria'
  const [currentIdx, setCurrentIdx] = useState(0);
  const [selectedAnswer, setSelectedAnswer] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [score, setScore] = useState(0);
  const [quizFinished, setQuizFinished] = useState(false);
  const [mirrorState, setMirrorState] = useState('idle'); // 'idle', 'correct', 'incorrect'

  // Estados para las integraciones de IA
  const [aiExplainText, setAiExplainText] = useState("");
  const [aiExplainLoading, setAiExplainLoading] = useState(false);
  const [aiExplainError, setAiExplainError] = useState("");

  const [oraculoPrompt, setOraculoPrompt] = useState("");
  const [oraculoResponses, setOraculoResponses] = useState([
    {
      role: 'mirror',
      text: "¡Hola, caminante! Soy el pequeño espejo tallado en madera de ébano. Nací en el África roja al compás del 'Tam Tam', viajé en barcos de dolor, conocí el granero de Buenos Aires, el miedo de Dorel en Valencia y las quebradas escarpadas de Mendoza. Preguntame lo que quieras sobre el pacto de ficción, la verosimilitud de mi viaje, el maestro, María Petra o las técnicas de estudio de la Unidad 2. ¡Hablemos de literatura!"
    }
  ]);
  const [oraculoLoading, setOraculoLoading] = useState(false);
  const [oraculoError, setOraculoError] = useState("");

  const currentQuestion = QUESTIONS[currentIdx];

  const handleAnswerClick = (key) => {
    if (answered) return;
    setSelectedAnswer(key);
  };

  const handleConfirm = () => {
    if (!selectedAnswer || answered) return;

    setAnswered(true);
    const isCorrect = selectedAnswer === currentQuestion.correctKey;
    if (isCorrect) {
      setScore(prev => prev + 1);
      setMirrorState('correct');
    } else {
      setMirrorState('incorrect');
    }
  };

  const handleNext = () => {
    setAnswered(false);
    setSelectedAnswer(null);
    setMirrorState('idle');
    setAiExplainText("");
    setAiExplainError("");
    
    if (currentIdx + 1 < QUESTIONS.length) {
      setCurrentIdx(prev => prev + 1);
    } else {
      setQuizFinished(true);
    }
  };

  const handleRestart = () => {
    setCurrentIdx(0);
    setSelectedAnswer(null);
    setAnswered(false);
    setScore(0);
    setQuizFinished(false);
    setMirrorState('idle');
    setAiExplainText("");
    setAiExplainError("");
  };

  const handleDeepenWithAI = async () => {
    setAiExplainLoading(true);
    setAiExplainError("");
    setAiExplainText("");

    // Nota pedagógica: esta función mostraba una explicación generada por IA.
    // Se mantiene la misma experiencia (el mismo tiempo de espera y el mismo
    // tono narrativo del espejo) pero sin depender de una API externa, para
    // que funcione siempre, en cualquier sitio donde se publique esta página.
    await new Promise(resolve => setTimeout(resolve, 900));

    setAiExplainLoading(false);
    setAiExplainError("El espejo todavía no puede conversar por sí mismo fuera del taller donde fue tallado. Para profundizar este tema, llevale la pregunta a tu profesor o profesora, o abrí una charla aparte con una IA como Claude.");
  };

  const handleSendMessageToOracle = async (e) => {
    if (e) e.preventDefault();
    if (!oraculoPrompt.trim() || oraculoLoading) return;

    const userMsg = oraculoPrompt;
    setOraculoResponses(prev => [...prev, { role: 'user', text: userMsg }]);
    setOraculoPrompt("");
    setOraculoLoading(true);
    setOraculoError("");

    // Misma nota que arriba: se conserva la experiencia de chat (burbujas,
    // espera, tono del espejo) sin depender de una API externa que no
    // funcionaría de forma segura en un sitio publicado.
    await new Promise(resolve => setTimeout(resolve, 900));

    setOraculoLoading(false);
    setOraculoResponses(prev => [...prev, {
      role: 'mirror',
      text: "El cristal se ha empañado con el frío de la noche colonial... todavía no puedo hablar por mí mismo fuera del taller donde fui tallado. Llevá tu pregunta a tu profesor o profesora, o abrí una charla aparte con una IA como Claude — seguro encuentran la respuesta juntos."
    }]);
  };


  const renderMirrorSVG = () => {
    let reflectionColor = "url(#idleReflect)";
    let borderPulse = "border-stone-700";

    if (mirrorState === 'correct') {
      reflectionColor = "url(#goldShine)";
      borderPulse = "animate-pulse border-amber-400 shadow-[0_0_30px_rgba(245,158,11,0.7)]";
    } else if (mirrorState === 'incorrect') {
      reflectionColor = "url(#foggyReflect)";
      borderPulse = "border-stone-900 shadow-[0_0_20px_rgba(120,113,108,0.5)]";
    }

    return (
      <div className="flex flex-col items-center justify-center p-4">
        <div className={`relative w-48 h-68 transition-all duration-500 rounded-full ${borderPulse}`}>
          <svg viewBox="0 0 200 300" className="w-full h-full drop-shadow-2xl">
            <defs>
              <linearGradient id="ebonyWood" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#1c1917" />
                <stop offset="50%" stopColor="#292524" />
                <stop offset="100%" stopColor="#0c0a09" />
              </linearGradient>
              <radialGradient id="idleReflect" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stopColor="#2c2523" />
                <stop offset="60%" stopColor="#1a1412" />
                <stop offset="100%" stopColor="#070504" />
              </radialGradient>
              <radialGradient id="goldShine" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stopColor="#fde047" />
                <stop offset="40%" stopColor="#eab308" />
                <stop offset="80%" stopColor="#854d0e" />
                <stop offset="100%" stopColor="#1c1917" />
              </radialGradient>
              <radialGradient id="foggyReflect" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stopColor="#f5f5f4" stopOpacity="0.9" />
                <stop offset="50%" stopColor="#a8a29e" stopOpacity="0.7" />
                <stop offset="90%" stopColor="#57534e" stopOpacity="0.4" />
                <stop offset="100%" stopColor="#1c1917" />
              </radialGradient>
            </defs>

            {/* Mango del Espejo Tallado */}
            <path d="M 100,210 C 90,240 85,270 92,295 C 95,299 105,299 108,295 C 115,270 110,240 100,210 Z" fill="url(#ebonyWood)" stroke="#b45309" strokeWidth="1.5" />
            <path d="M 94,240 Q 100,250 106,240" fill="none" stroke="#b45309" strokeWidth="2.5" strokeLinecap="round"/>
            <path d="M 92,265 Q 100,275 108,265" fill="none" stroke="#b45309" strokeWidth="2.5" strokeLinecap="round"/>

            {/* Marco de Ébano */}
            <ellipse cx="100" cy="115" rx="80" ry="105" fill="url(#ebonyWood)" stroke="#d97706" strokeWidth="3.5" />
            {/* Cristal Reflector */}
            <ellipse cx="100" cy="115" rx="68" ry="92" fill={reflectionColor} className="transition-all duration-700 ease-in-out" />

            {/* Destellos de Aprobación */}
            {mirrorState === 'correct' && (
              <g className="animate-pulse">
                <path d="M 60,70 Q 70,70 70,60 Q 70,70 80,70 Q 70,70 70,80 Q 70,70 60,70" fill="#ffffff" />
                <path d="M 130,150 Q 135,150 135,145 Q 135,150 140,150 Q 135,150 135,155 Q 135,150 130,150" fill="#ffffff" />
                <circle cx="100" cy="115" r="45" fill="none" stroke="#fef08a" strokeWidth="1.5" strokeDasharray="6,6" className="animate-spin" style={{ transformOrigin: '100px 115px', animationDuration: '6s' }} />
              </g>
            )}

            {/* Bruma de Error */}
            {mirrorState === 'incorrect' && (
              <g opacity="0.85" className="animate-pulse">
                <path d="M 70,110 Q 80,95 100,105 Q 120,95 130,110 Q 140,125 125,135 Q 110,140 100,130 Q 90,140 75,135 Q 60,125 70,110 Z" fill="#e7e5e4" opacity="0.65" filter="blur(4px)" />
                <path d="M 85,85 Q 95,75 110,80 Q 125,75 130,90 Q 135,100 120,105 Q 110,110 100,100 Q 90,110 85,100 Z" fill="#d6d3d1" opacity="0.45" filter="blur(5px)" />
              </g>
            )}

            {/* Texto grabado del lomo */}
            <path d="M 70,195 Q 100,190 130,195" fill="none" stroke="#d97706" strokeWidth="1" strokeDasharray="3,3" />
            <text x="100" y="188" fill="#d97706" fontSize="8" textAnchor="middle" fontFamily="serif" letterSpacing="1">ATIMA IMAOMA</text>
          </svg>
        </div>
        <div className="mt-4 text-center">
          {mirrorState === 'idle' && (
            <span className="text-xs font-serif italic text-stone-400">El espejo espera en silencio tu respuesta...</span>
          )}
          {mirrorState === 'correct' && (
            <span className="text-xs font-serif font-bold text-amber-400 animate-bounce">⭐ El espejo brilla con luz de libertad.</span>
          )}
          {mirrorState === 'incorrect' && (
            <span className="text-xs font-serif font-bold text-stone-400">🌫️ El espejo se ha empañado de bruma gris.</span>
          )}
        </div>
      </div>
    );
  };

  return (
    <div className="min-h-screen bg-stone-900 text-stone-100 flex flex-col justify-between font-sans selection:bg-amber-800/40 selection:text-amber-200">
      
      {/* Cabecera Académica */}
      <header className="border-b border-stone-800 bg-stone-950 px-6 py-4 shadow-lg">
        <div className="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
          <div className="text-center md:text-left">
            <p className="text-xs font-serif uppercase tracking-widest text-amber-500 font-semibold">Unidad 2: Capítulos 1 a 3 | Teoría y Lectura</p>
            <h1 className="text-2xl font-serif font-extrabold text-stone-100 mt-1 tracking-tight">
              El espejo africano <span className="text-stone-400 font-normal">| Actividad Integradora</span>
            </h1>
          </div>
          
          {/* Navegación por pestañas */}
          <div className="flex flex-wrap justify-center gap-2">
            <button 
              onClick={() => setActiveTab('quiz')}
              className={`px-4 py-2 text-xs font-semibold rounded-lg border transition-all ${
                activeTab === 'quiz' 
                  ? 'bg-amber-500 text-stone-950 border-amber-400 font-bold shadow-md shadow-amber-500/20' 
                  : 'bg-stone-900 text-stone-400 border-stone-800 hover:text-stone-200'
              }`}
            >
              Cuestionario Unidad 2
            </button>
            <button 
              onClick={() => setActiveTab('oraculo')}
              className={`px-4 py-2 text-xs font-semibold rounded-lg border transition-all flex items-center gap-1.5 ${
                activeTab === 'oraculo' 
                  ? 'bg-amber-500 text-stone-950 border-amber-400 font-bold shadow-md shadow-amber-500/20' 
                  : 'bg-stone-900 text-stone-400 border-stone-800 hover:text-stone-200'
              }`}
            >
              El Espejo Parlante 🔮
            </button>
            <button 
              onClick={() => setActiveTab('teoria')}
              className={`px-4 py-2 text-xs font-semibold rounded-lg border transition-all ${
                activeTab === 'teoria' 
                  ? 'bg-amber-500 text-stone-950 border-amber-400 font-bold shadow-md shadow-amber-500/20' 
                  : 'bg-stone-900 text-stone-400 border-stone-800 hover:text-stone-200'
              }`}
            >
              Resumen Teórico 📖
            </button>
          </div>

          {/* Marcador de Progreso */}
          <div className="flex items-center gap-3 bg-stone-900 border border-stone-800 px-4 py-2 rounded-lg">
            <div className="text-center">
              <span className="block text-[9px] uppercase text-stone-400 tracking-wider">Puntaje</span>
              <span className="text-base font-mono font-bold text-amber-500">{score} / 9</span>
            </div>
            <div className="h-8 w-px bg-stone-800" />
            <div className="text-center">
              <span className="block text-[9px] uppercase text-stone-400 tracking-wider">Progreso</span>
              <span className="text-xs font-semibold text-stone-300">{quizFinished ? 'Fin' : `${currentIdx + 1} de 9`}</span>
            </div>
          </div>
        </div>
      </header>

      {/* Contenido Principal */}
      <main className="flex-grow max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">
        
        {activeTab === 'quiz' && (
          /* PESTAÑA 1: CUESTIONARIO INTEGRADO */
          !quizFinished ? (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
              
              {/* Lado Izquierdo: Tarjeta de Pregunta y opciones */}
              <div className="lg:col-span-8 flex flex-col justify-between bg-stone-950/70 border border-stone-800/80 rounded-2xl p-6 shadow-2xl">
                <div>
                  <div className="flex items-center justify-between gap-2 mb-4">
                    <span className="inline-block bg-amber-950/60 text-amber-400 border border-amber-900/40 text-xs font-serif px-3 py-1 rounded-full">
                      {currentQuestion.title}
                    </span>
                    <span className="text-xs text-stone-400 uppercase tracking-wider font-mono">
                      {currentQuestion.category}
                    </span>
                  </div>

                  <h2 className="text-base sm:text-lg font-serif text-stone-100 font-semibold mb-6 leading-relaxed">
                    {currentQuestion.question}
                  </h2>

                  {/* Opciones de respuesta */}
                  <div className="space-y-3">
                    {currentQuestion.options.map((opt) => {
                      const isSelected = selectedAnswer === opt.key;
                      const isCorrect = currentQuestion.correctKey === selectedAnswer;
                      let optionClass = "border-stone-800 hover:border-amber-600/40 hover:bg-stone-900/40";
                      
                      if (isSelected) {
                        optionClass = "border-amber-500 bg-amber-950/20 text-amber-200 ring-1 ring-amber-500/40";
                      }
                      if (answered) {
                        optionClass = "opacity-50 border-stone-800 pointer-events-none";
                        if (opt.key === currentQuestion.correctKey) {
                          optionClass = "border-emerald-500 bg-emerald-950/30 text-emerald-200 pointer-events-none font-semibold shadow-inner";
                        } else if (isSelected && !isCorrect) {
                          optionClass = "border-rose-900 bg-rose-950/30 text-rose-200 pointer-events-none";
                        }
                      }

                      return (
                        <button
                          key={opt.key}
                          onClick={() => handleAnswerClick(opt.key)}
                          disabled={answered}
                          className={`w-full text-left flex items-start gap-3 p-4 rounded-xl border text-xs sm:text-sm transition-all duration-200 outline-none ${optionClass}`}
                        >
                          <span className={`flex-shrink-0 w-6 h-6 flex items-center justify-center rounded-lg text-xs font-mono font-bold transition-colors ${
                            isSelected ? 'bg-amber-500 text-stone-950' : 'bg-stone-800 text-stone-300'
                          }`}>
                            {opt.key}
                          </span>
                          <span className="leading-snug">{opt.text}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Acciones y Retroalimentación con IA */}
                <div className="mt-6 pt-6 border-t border-stone-900">
                  {!answered ? (
                    <div className="flex justify-end">
                      <button
                        onClick={handleConfirm}
                        disabled={!selectedAnswer}
                        className={`px-6 py-3 rounded-xl font-semibold text-xs uppercase tracking-wider transition-all shadow-md ${
                          selectedAnswer
                            ? 'bg-amber-500 text-stone-950 hover:bg-amber-400 cursor-pointer hover:shadow-amber-500/10'
                            : 'bg-stone-800 text-stone-500 cursor-not-allowed'
                        }`}
                      >
                        Confirmar Respuesta
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {/* Mensaje de respuesta */}
                      {selectedAnswer === currentQuestion.correctKey ? (
                        <div className="bg-emerald-950/25 border border-emerald-500/30 rounded-xl p-4 text-emerald-200 text-xs sm:text-sm leading-relaxed animate-fadeIn">
                          <strong className="text-emerald-400 block mb-1 font-serif text-sm">
                            ⭐ El espejo ha acompañado tu respuesta.
                          </strong>
                          {currentQuestion.justification}
                        </div>
                      ) : (
                        <div className="bg-rose-950/25 border border-rose-500/20 rounded-xl p-4 text-rose-200 text-xs sm:text-sm leading-relaxed animate-fadeIn">
                          <strong className="text-rose-400 block mb-1 font-serif text-sm">
                            🌫️ El espejo se ha empañado y no te dejó ver la respuesta correcta.
                          </strong>
                          {currentQuestion.justification}
                        </div>
                      )}

                      {/* INTEGRACIÓN IA: Profundización Pedagógica */}
                      <div className="bg-stone-900 border border-stone-800 rounded-xl p-4">
                        <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
                          <div className="text-center sm:text-left">
                            <h4 className="text-xs font-serif font-bold text-amber-400">¿Querés profundizar en el marco teórico de este tema?</h4>
                            <p className="text-[10px] text-stone-400">Pedile al Espejo Inteligente que te explique el significado literario de este suceso o técnica.</p>
                          </div>
                          <button
                            onClick={handleDeepenWithAI}
                            disabled={aiExplainLoading}
                            className="bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 px-4 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all self-stretch sm:self-auto justify-center"
                          >
                            {aiExplainLoading ? (
                              <span className="flex items-center gap-1">
                                <svg className="animate-spin h-3.5 w-3.5 text-amber-300" fill="none" viewBox="0 0 24 24">
                                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                                </svg>
                                Escuchando al maestro...
                              </span>
                            ) : "Profundizar con Inteligencia Artificial ✨"}
                          </button>
                        </div>

                        {/* Mostrar Explicación de la IA */}
                        {aiExplainText && (
                          <div className="mt-4 pt-4 border-t border-stone-800/80 text-xs text-stone-300 leading-relaxed font-serif italic bg-stone-950/40 p-3 rounded-lg border border-stone-800/30 animate-fadeIn">
                            {aiExplainText}
                          </div>
                        )}

                        {aiExplainError && (
                          <p className="text-xs text-rose-400 mt-2 italic">{aiExplainError}</p>
                        )}
                      </div>

                      <div className="flex justify-end">
                        <button
                          onClick={handleNext}
                          className="px-6 py-3 bg-stone-800 hover:bg-stone-700 text-stone-100 rounded-xl font-semibold text-xs uppercase tracking-wider transition-all shadow-md"
                        >
                          {currentIdx + 1 === QUESTIONS.length ? 'Finalizar Actividad' : 'Siguiente Pregunta ➔'}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* Lado Derecho: Visualizador del Espejo SVG */}
              <div className="lg:col-span-4 flex flex-col justify-center items-center bg-stone-950/40 border border-stone-800/60 rounded-2xl p-4 shadow-inner">
                {renderMirrorSVG()}
              </div>
            </div>
          ) : (
            /* PANTALLA DE RESULTADOS / INTENTEMOS NUEVAMENTE (En voseo) */
            <div className="max-w-xl mx-auto bg-stone-950/85 border border-stone-800 rounded-2xl p-8 text-center shadow-2xl animate-scaleUp">
              <div className="mb-6 flex justify-center">
                <div className="w-24 h-24 bg-stone-900 border-2 border-amber-600/50 rounded-full flex items-center justify-center shadow-lg">
                  <span className="text-4xl">
                    {score >= 6 ? '✨' : '🌫️'}
                  </span>
                </div>
              </div>

              <h2 className="text-2xl font-serif font-extrabold text-stone-100 mb-2">¡Recorrido de la Unidad 2 Completado!</h2>
              <p className="text-stone-400 text-xs mb-6">Evaluaste tu lectura de los Capítulos 1, 2 y 3 y los saberes metodológicos de la Unidad.</p>

              <div className="bg-stone-900 border border-stone-800 rounded-xl p-6 mb-8 max-w-sm mx-auto">
                <span className="block text-xs uppercase text-stone-400 tracking-wider mb-1">Calificación Final</span>
                <span className="text-5xl font-mono font-extrabold text-amber-500">{score} <span className="text-stone-500 text-2xl">/ 9</span></span>
                
                <div className="mt-4 pt-4 border-t border-stone-800">
                  {score === 9 ? (
                    <p className="text-emerald-400 font-serif font-medium text-xs">¡Excelente! Comprendiste perfectamente cada cruce de destinos y el marco teórico de la Unidad 2.</p>
                  ) : score >= 6 ? (
                    <p className="text-amber-400 font-serif font-medium text-xs">¡Muy bien! Demostraste un sólido conocimiento de las historias iniciales y las técnicas de estudio del libro.</p>
                  ) : (
                    <div className="space-y-2">
                      <p className="text-rose-400 font-serif font-bold text-base">"Intentemos nuevamente"</p>
                      <p className="text-stone-400 text-xs leading-normal">Repasá los apuntes teóricos sobre el pacto de ficción o el método Cornell y volvé a intentarlo para conseguir el brillo dorado del espejo.</p>
                    </div>
                  )}
                </div>
              </div>

              <button
                onClick={handleRestart}
                className={`px-8 py-3.5 rounded-xl font-bold text-xs tracking-wider uppercase transition-all shadow-md ${
                  score < 6
                    ? 'bg-rose-600 hover:bg-rose-500 text-white'
                    : 'bg-amber-500 hover:bg-amber-400 text-stone-950'
                }`}
              >
                {score < 6 ? 'Intentar nuevamente' : 'Reiniciar Actividad'}
              </button>
            </div>
          )
        )}

        {activeTab === 'oraculo' && (
          /* PESTAÑA 2: EL ORÁCULO DEL ESPEJO (Voseo) */
          <div className="max-w-3xl w-full mx-auto bg-stone-950/80 border border-stone-800 rounded-2xl overflow-hidden shadow-2xl flex flex-col h-[520px]">
            {/* Cabecera del Oráculo */}
            <div className="bg-stone-900 px-6 py-4 border-b border-stone-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-amber-500/10 border border-amber-500/30 rounded-full flex items-center justify-center text-amber-400 text-xl">
                  🔮
                </div>
                <div>
                  <h3 className="font-serif font-bold text-stone-200 text-sm">El Oráculo del Espejo de Ébano</h3>
                  <p className="text-[10px] text-stone-400 font-serif italic">"El revés de las cosas suele guardar la verdad..."</p>
                </div>
              </div>
              <button 
                onClick={() => setOraculoResponses([{
                  role: 'mirror',
                  text: "¡Hola, caminante! Soy el pequeño espejo tallado en madera de ébano. Nací en el África roja al compás del 'Tam Tam', viajé en barcos de dolor, conocí el granero de Buenos Aires, el miedo de Dorel en Valencia y las quebradas escarpadas de Mendoza. Preguntame lo que quieras sobre el pacto de ficción, la verosimilitud de mi viaje, el maestro, María Petra o las técnicas de estudio de la Unidad 2. ¡Hablemos de literatura!"
                }])}
                className="text-[10px] bg-stone-800 hover:bg-stone-700 text-stone-300 px-2.5 py-1.5 rounded border border-stone-700 transition-all"
              >
                Limpiar Espejo
              </button>
            </div>

            {/* Panel de Conversación */}
            <div className="flex-grow p-6 overflow-y-auto space-y-4 bg-stone-950/40 flex flex-col">
              {oraculoResponses.map((msg, i) => (
                <div 
                  key={i} 
                  className={`max-w-[85%] rounded-2xl p-4 text-xs leading-relaxed ${
                    msg.role === 'mirror'
                      ? 'bg-amber-950/10 border border-amber-900/20 text-stone-200 self-start font-serif italic'
                      : 'bg-stone-800 text-stone-100 self-end font-sans'
                  }`}
                >
                  <span className="block text-[8px] uppercase tracking-wider font-sans font-bold text-amber-500 mb-1">
                    {msg.role === 'mirror' ? '🔮 Ecos de la Madera' : '👤 Estudiante'}
                  </span>
                  {msg.text}
                </div>
              ))}

              {oraculoLoading && (
                <div className="bg-amber-950/10 border border-amber-900/20 rounded-2xl p-4 text-xs text-stone-400 self-start font-serif italic flex items-center gap-2 max-w-[80%]">
                  <svg className="animate-spin h-4 w-4 text-amber-500" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                  </svg>
                  <span>El ébano vibra... devolviendo voces de la historia...</span>
                </div>
              )}

              {oraculoError && (
                <div className="bg-rose-950/20 border border-rose-900/30 rounded-xl p-3 text-rose-300 text-xs self-center">
                  {oraculoError}
                </div>
              )}
            </div>

            {/* Formulario de Entrada */}
            <form onSubmit={handleSendMessageToOracle} className="bg-stone-900 border-t border-stone-800 p-4 flex items-center gap-3">
              <input
                type="text"
                value={oraculoPrompt}
                onChange={(e) => setOraculoPrompt(e.target.value)}
                placeholder="Preguntale al espejo sobre la historia, los personajes o la teoría de la Unidad 2..."
                disabled={oraculoLoading}
                className="flex-grow bg-stone-950 border border-stone-800 text-xs text-stone-100 rounded-xl px-4 py-3 outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500/20 transition-all"
              />
              <button
                type="submit"
                disabled={!oraculoPrompt.trim() || oraculoLoading}
                className={`px-5 py-3 rounded-xl font-bold text-xs transition-all flex items-center gap-1.5 ${
                  oraculoPrompt.trim() && !oraculoLoading
                    ? 'bg-amber-500 text-stone-950 hover:bg-amber-400 cursor-pointer shadow-md'
                    : 'bg-stone-800 text-stone-500 cursor-not-allowed border border-stone-700'
                }`}
              >
                Preguntar ✨
              </button>
            </form>
          </div>
        )}

        {activeTab === 'teoria' && (
          /* PESTAÑA 3: RESUMEN TEÓRICO ACADÉMICO (Adaptado al voseo) */
          <div className="max-w-4xl w-full mx-auto bg-stone-950/80 border border-stone-800 rounded-2xl p-6 sm:p-8 space-y-6 overflow-y-auto max-h-[550px] animate-fadeIn">
            <h2 className="text-xl font-serif font-extrabold text-amber-500 border-b border-stone-800 pb-3 flex items-center gap-2">
              <span>📖</span> Conceptos Clave para tus Notas de Estudio
            </h2>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {/* Bloque 1: Pacto de Ficción y Verosimilitud */}
              <div className="bg-stone-900/40 p-5 rounded-xl border border-stone-800/80">
                <h3 className="font-serif font-bold text-stone-200 text-sm mb-2 text-amber-400/90">El Pacto de Ficción & Verosimilitud</h3>
                <p className="text-xs text-stone-300 leading-relaxed">
                  Cuando empezás a leer, suspendés tu incredulidad. No le exigís a la novela que el espejo sea un objeto científicamente mágico, sino que sea <strong>verosímil</strong> (es decir, coherente y creíble dentro de su contexto histórico: la trata de personas y las Guerras de la Independencia).
                </p>
              </div>

              {/* Bloque 2: Historia vs. Relato */}
              <div className="bg-stone-900/40 p-5 rounded-xl border border-stone-800/80">
                <h3 className="font-serif font-bold text-stone-200 text-sm mb-2 text-amber-400/90">La Historia frente al Relato</h3>
                <p className="text-xs text-stone-300 leading-relaxed">
                  La <strong>Historia</strong> es el conjunto cronológico y real de los hechos (de 1779 a 1818). El <strong>Relato</strong> es el orden en el que la autora elige contártelos para generar intriga y emoción (saltando hacia adelante y atrás en el tiempo).
                </p>
              </div>

              {/* Bloque 3: Actantes Ayudantes */}
              <div className="bg-stone-900/40 p-5 rounded-xl border border-stone-800/80">
                <h3 className="font-serif font-bold text-stone-200 text-sm mb-2 text-amber-400/90">Personajes Actantes (Ayudantes)</h3>
                <p className="text-xs text-stone-300 leading-relaxed">
                  Para cumplir sus metas, los personajes reciben fuerzas de apoyo. El <strong>maestro</strong> desmiente los miedos irracionales de María Petra con datos reales; el <strong>niño pelirrojo</strong> trae el objeto; y el propio <strong>espejo</strong> actúa de ayudante confrontando a Dorel con su propia realidad física y moral.
                </p>
              </div>

              {/* Bloque 4: Técnicas de Toma de Notas */}
              <div className="bg-stone-900/40 p-5 rounded-xl border border-stone-800/80">
                <h3 className="font-serif font-bold text-stone-200 text-sm mb-2 text-amber-400/90">Toma de Notas (Tus Estrategias)</h3>
                <p className="text-xs text-stone-300 leading-relaxed">
                  Podés organizar tus lecturas con las siguientes metodologías activas:
                  <br />- <strong>Método Cornell:</strong> Dividís tu hoja en ideas clave (izquierda), notas generales (derecha) y resumen sintético (abajo).
                  <br />- <strong>Método de Cajas:</strong> Cuadrículas dedicadas a subtemas o personajes específicos.
                  <br />- <strong>Método de Mapas:</strong> Ramificaciones visuales jerárquicas desde una idea central.
                </p>
              </div>
            </div>

            <div className="bg-amber-950/10 border border-amber-900/30 p-4 rounded-xl text-xs text-stone-300 font-serif italic text-center">
              "El revés de las cosas suele guardar la verdad... y la verdad siempre busca la libertad".
            </div>
          </div>
        )}
      </main>

      {/* Pie de Página */}
      <footer className="border-t border-stone-950 bg-stone-950 py-3 text-center text-[11px] text-stone-500 font-serif italic">
        "Somos cuentos contando cuentos, nada." — Ricardo Reis (Fernando Pessoa)
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
